name: Preflight

# Checks a commit before it goes to main (see scripts/preflight.sh). The run always
# concludes successfully, so a broken commit here sends no failure e-mail; the real
# result is the "PREFLIGHT_RESULT" line in the log.
on:
  push:
    branches: [preflight]

# Read-only token: these runs only check the code.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen swiftlint
      - name: Cache the build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: dd-${{ runner.os }}-${{ hashFiles('project.yml') }}-
      - name: Lint, build and test
        run: |
          lint=pass
          tests=pass
          swiftlint --strict > lint.log 2>&1 || lint=fail
          xcodegen generate > /dev/null
          set -o pipefail
          xcodebuild test \
            -project Dynotch.xcodeproj \
            -scheme Dynotch \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || tests=fail

          echo "::group::Lint findings"
          grep -E "(warning|error):" lint.log || true
          echo "::endgroup::"
          echo "::group::Build and test findings"
          grep -E "error:|✘|Test run with|\*\* TEST" test.log | sort -u || true
          if [ "$tests" = fail ]; then grep -E -i "failed|crash|Undefined|ld:|signal|exception|Testing" test.log | tail -40 || true; tail -40 test.log; fi
          echo "::endgroup::"
          echo "PREFLIGHT_RESULT sha=$GITHUB_SHA lint=$lint tests=$tests"
