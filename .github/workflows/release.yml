name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0) – builds without publishing a release"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # Runs on Linux: waits until CI has passed for this commit, so CI and the release never ask
  # for macOS runners at the same time, and nothing untested is released.
  wait-for-ci:
    name: Wait for CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the CI run of this commit
        run: |
          for _ in $(seq 1 240); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            echo "CI: ${run:-not started}"
            case "$run" in
              "completed success") exit 0 ;;
              "completed "*) echo "::error::CI did not pass for $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for CI"
          exit 1

  release:
    needs: wait-for-ci
    # Manual test builds (workflow_dispatch) skip the wait.
    if: ${{ always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped') }}
    runs-on: macos-26
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" ]]; then
            # An ad-hoc signed build cannot update installed copies (spec U-2): no release (spec RF-3).
            echo "::error::SIGNING_CERT_P12 secret missing, not releasing an unsigned build"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # codesign looks identities up through the keychain search list.
          # shellcheck disable=SC2046 # one argument per keychain path
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN"
          IDENTITY_HASH="$(security find-identity -p codesigning "$KEYCHAIN" \
            | awk '/"Dynotch Self-Signed"/ { print $2; exit }')"
          if [[ -z "$IDENTITY_HASH" ]]; then
            echo "::error::Dynotch Self-Signed identity not found after import"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY_HASH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build
        run: ./scripts/build-release.sh

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Dynotch-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1.x.y with y > 0 is a test build: a prerelease, not "latest" (spec U-6, U-8).
          if [[ "${VERSION##*.}" != "0" ]]; then
            CHANNEL=(--prerelease --latest=false); TITLE="Dynotch $VERSION (test)"
          else
            CHANNEL=(--latest); TITLE="Dynotch $VERSION"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$TITLE" \
            --generate-notes "${CHANNEL[@]}"
