name: Wingmate
options:
  bundleIdPrefix: com.peterkereki
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # The terminal emulator under the Terminal module (spec TE-1).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.12 and later need the Metal toolchain (and 1.19 a build plug-in xcodebuild must trust).
    exactVersion: 1.11.2

settings:
  base:
    MARKETING_VERSION: "1.9.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Wingmate:
    type: application
    platform: macOS
    sources:
      - path: Wingmate
    dependencies:
      - package: SwiftTerm
    info:
      path: Wingmate/Resources/Info.plist
      properties:
        # These must match the file name Wingmate.app, or Finder takes the app for renamed by the user and
        # ignores the localized name. en.lproj/InfoPlist.strings gives the visible name Wingmate (WM-3).
        CFBundleDisplayName: Wingmate
        CFBundleName: Wingmate
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.peterkereki.Wingmate
            CFBundleURLSchemes: [wingmate]
        NSCalendarsFullAccessUsageDescription: "Wingmate shows your upcoming events in the notch."
        NSBluetoothAlwaysUsageDescription: "Wingmate shows a notice when a Bluetooth device connects or disconnects, with its battery."
        NSAppleEventsUsageDescription: "Wingmate reads and saves your notes in Notes, sends a text through Messages when you reply to a call, shows and controls what Spotify plays, shows your unread mail from Mail, and reads the unread counts in the titles of your Gmail and Google Chat tabs in Ardia."
        NSMicrophoneUsageDescription: "Wingmate records your voice with a screen recording when you turn the microphone on, and warns you when you talk while muted in a Teams meeting (it only checks the level, nothing is recorded)."
        NSDesktopFolderUsageDescription: "Wingmate's Cleaner lists files over 500 MB on your Desktop so you can move them to the Trash."
        NSDocumentsFolderUsageDescription: "Wingmate's Cleaner lists files over 500 MB in your Documents so you can move them to the Trash."
        NSDownloadsFolderUsageDescription: "Wingmate puts a file you just downloaded into the Tray when the notch opens."
        NSContactsUsageDescription: "Wingmate looks up the caller's phone number to send them a text."
        NSRemindersFullAccessUsageDescription: "Wingmate shows your reminders and checks them off in the notch and the menu bar."
        NSRemindersUsageDescription: "Wingmate shows your reminders and checks them off in the notch and the menu bar."
        NSCalendarsUsageDescription: "Wingmate shows your upcoming events in the notch."
        NSLocationUsageDescription: "Wingmate shows the weather where you are in the calendar and in a morning forecast."
        NSLocationWhenInUseUsageDescription: "Wingmate shows the weather where you are in the calendar and in a morning forecast."
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Wingmate"
        NSServices:
          - NSMenuItem:
              default: New Wingmate Note
            NSMessage: makeNote
            NSPortName: Wingmate
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
            NSRequiredContext: {}
    entitlements:
      path: Wingmate/Resources/Wingmate.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.personal-information.calendars: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterkereki.Wingmate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Test and debug builds are a different app for macOS: they never take the installed app's
        # permissions (Contacts, Full Disk Access…), which are kept per identifier (spec C-8c).
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.peterkereki.Wingmate.debug
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint >/dev/null; then
            swiftlint --quiet
          else
            echo "warning: SwiftLint not installed (brew install swiftlint)"
          fi

  WingmateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WingmateTests
    dependencies:
      - target: Wingmate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterkereki.WingmateTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wingmate.app/Contents/MacOS/Wingmate

schemes:
  Wingmate:
    build:
      targets:
        Wingmate: all
        WingmateTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Wingmate
      targets:
        - WingmateTests
    archive:
      config: Release
